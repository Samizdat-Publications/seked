<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html, body { background: #0f0e0c; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0e0c">
<title>Seked: the exhibit</title>
<meta name="description" content="The strongest case for an older Giza, told standing on the plateau: path-traced panoramas, narrated leaf by leaf, with the archaeologists' reply one tap away.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Marcellus&display=swap">
</head>
<body>
<main class="stage" id="stage">
  <canvas id="view" tabindex="0" role="application" aria-roledescription="panorama" aria-label="Panorama. Drag, or use the arrow keys, to look around. Plus and minus zoom."></canvas>
  <div class="flat" id="flat" tabindex="0" aria-label="The panorama, laid out flat. Scroll sideways to look around." hidden></div>
  <canvas class="ink" id="ink" aria-hidden="true"></canvas>
  <video class="flight" id="flight" muted playsinline preload="auto" aria-hidden="true" hidden></video>
  <div class="veil" aria-hidden="true"></div>
  <p class="status" id="status" role="status">Loading the panorama</p>
  <section class="band" aria-label="Narration">
    <p class="where"><span class="pill" id="pill" hidden></span><span id="place"></span><span class="sep" aria-hidden="true">&middot;</span><span id="when"></span></p>
    <p class="caption" id="caption" aria-live="polite"></p>
    <nav class="controls" id="controls" aria-label="Play" hidden>
      <button type="button" class="ctl" id="prev" aria-label="Previous leaf"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3 5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="ctl play" id="play" aria-pressed="false" aria-label="Play"><svg class="i-play" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z" fill="currentColor"/></svg><svg class="i-pause" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z" fill="currentColor"/></svg><span class="play-word">Play</span></button>
      <button type="button" class="ctl" id="next" aria-label="Next leaf"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="chapters">
        <button type="button" class="ctl chapter" id="chapter" aria-expanded="false" aria-controls="chapter-list"></button>
        <span class="chapter-list" id="chapter-list" hidden></span>
      </span>
      <span class="count" id="count"></span>
    </nav>
  </section>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
