id: D2
title: Legon's rectangle
group: site-plan
summary: >-
  The three pyramids sit inside a rectangle bounded by the east and north
  faces of the Great Pyramid and the west and south faces of Menkaure's,
  measuring 1000 root 2 by 1000 root 3 royal cubits (1414.2 by 1732.1).
comparisons:
  - label: east-west extent in cubits against 1000 root 2
    formula: (g1.base.half + g3.centre.offset.west + g3.base.half) / cubit.royal
    target: 1000 * sqrt(2)
  - label: north-south extent in cubits against 1000 root 3
    formula: (g1.base.half + g3.centre.offset.south + g3.base.half) / cubit.royal
    target: 1000 * sqrt(3)
tolerance_pct: 0.5
free_choices:
  - the cubit length used to convert the metric extents
overlay:
  type: ground-rectangle
  params:
    corners: [g1.corner.ne, g3.corner.sw]
    structures: [g1, g2, g3]
sources:
  for: [legon-1979]
  context: [petrie-1883, lehner-1997]
notes: >-
  Legon quotes 1417.5 by 1732 cubits from Petrie's survey. Here the extents
  are built from Petrie's centre-to-centre offsets (section 92) and the mean
  half-bases of G1 and G3, so Menkaure's slightly rectangular base (102.2 by
  104.6 m in Lehner) enters as its mean side; that is worth about 1.2 m, or
  0.16 percent, on the shorter extent. Petrie found no exact relation between
  the centres and no evidence the layout was planned as a whole.
