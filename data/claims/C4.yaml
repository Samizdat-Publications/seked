id: C4
title: Orion Correlation
group: sky
status: computed
epoch: -10449
summary: >-
  The three pyramids are laid out as Orion's Belt (Alnitak, Alnilam,
  Mintaka), including Menkaure's offset from the diagonal, and the belt's
  angle to the meridian matched the pyramids' diagonal in 10,450 BCE.
comparisons:
  - label: belt angle from the meridian against the G1 to G3 diagonal
    formula: >-
      atan(abs((atan2(sin(star.mintaka.ra - star.alnitak.ra), cos(star.mintaka.ra - star.alnitak.ra))) * cos(star.alnilam.dec)) / abs(star.mintaka.dec - star.alnitak.dec))
    target: >-
      atan(g3.centre.offset.west / g3.centre.offset.south)
    unit: deg
  - label: Menkaure off the G1 to G2 line against Mintaka off the Alnitak to Alnilam line
    formula: >-
      abs(g2.centre.offset.west * g3.centre.offset.south - g2.centre.offset.south * g3.centre.offset.west) / (g2.centre.offset.west^2 + g2.centre.offset.south^2)
    target: >-
      abs((star.alnitak.dec - star.alnilam.dec) * (atan2(sin(star.mintaka.ra - star.alnilam.ra), cos(star.mintaka.ra - star.alnilam.ra))) * cos(star.alnilam.dec) - (atan2(sin(star.alnitak.ra - star.alnilam.ra), cos(star.alnitak.ra - star.alnilam.ra))) * cos(star.alnilam.dec) * (star.mintaka.dec - star.alnilam.dec)) / (((atan2(sin(star.alnitak.ra - star.alnilam.ra), cos(star.alnitak.ra - star.alnilam.ra))) * cos(star.alnilam.dec))^2 + (star.alnitak.dec - star.alnilam.dec)^2)
    unit: ratio
tolerance_pct: 5
free_choices:
  - the epoch
  - the orientation of the sky map relative to the ground (north–south inversion)
  - the matching rule (angle, spacing or both)
overlay:
  type: sky-projection
  params:
    stars: [Alnitak, Alnilam, Mintaka]
    ground: [g1, g2, g3]
sources:
  for: [bauval-gilbert-1994, hancock-1995, hancock-bauval-1996]
  against: [krupp-1997, fairall-1999]
  context: [vondrak-2011]
notes: >-
  Right-ascension differences are folded into the range from -180 to 180
  degrees with atan2(sin, cos), so the belt reads correctly in the centuries
  when it straddles zero right ascension (about 5060 to 4820 BCE).
  Both comparisons are unsigned, because the claim is about shape rather
  than handedness. The sky is taken as seen looking south, with the belt
  laid on a tangent plane about Alnilam (x = Δra × cos dec, y = Δdec, both in
  degrees), which is accurate to a few arcminutes over the belt's 2.7°. On
  the ground the diagonal is Petrie's G1 to G3 centre offsets, measured from
  the meridian, and Menkaure's offset is his perpendicular distance from the
  G1 to G2 line divided by the length of that line, so both offsets are
  scale free. Krupp's objection, that laying the sky on the plateau requires
  swapping north for south, is recorded here as a free choice and is not
  modelled: nothing below tests it. Tolerance is 5 %, nearly 2° on a 38°
  diagonal, a band far looser than any surveyor would accept, chosen so the
  claim is judged as the visual match it is asserted to be rather than as a
  survey. Long-term precession (Vondrák 2011) is what makes the epoch
  meaningful at all; the IAU 2006 model is wrong by degrees at −10449, and
  the belt's angle sweeps roughly a degree a century, so a claim tied to an
  epoch is a claim tied to that free choice.
