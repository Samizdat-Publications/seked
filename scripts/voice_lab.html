<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Lab</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1b18; --muted:#6d675e; --line:#e3ded4; --accent:#9a5b13; --pick:#2f7d4f; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --card:#211e18; --ink:#ece7dd; --muted:#a39b8e; --line:#38332a; --accent:#e0a050; --pick:#5cc58a; --err:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; font-size:13px; padding:2px 8px; border:1px solid var(--line); border-radius:99px; }
  nav a.done { color:var(--pick); border-color:var(--pick); }
  main { max-width:1100px; margin:0 auto; padding:20px 24px 80px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  section h2 { font-size:16px; margin:0 0 10px; display:flex; justify-content:space-between; }
  section h2 small { color:var(--muted); font-weight:400; }
  .grid { display:grid; grid-template-columns: 1fr 320px; gap:20px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  textarea { width:100%; min-height:150px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; }
  .changed { color:var(--accent); font-size:12px; }
  .settings { display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; font-size:13px; }
  .settings input[type=range] { width:100%; }
  select { font:inherit; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px; }
  button { font:inherit; font-size:13px; border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:7px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:var(--card); }
  button:disabled { opacity:.5; cursor:wait; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .takes { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .take { display:grid; grid-template-columns: 26px 1fr 0; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .take.picked { border-color:var(--pick); box-shadow:0 0 0 1px var(--pick) inset; }
  .take audio { width:100%; height:34px; }
  .take .meta { font-size:12px; color:var(--muted); }
  .take input[type=radio] { accent-color:var(--pick); width:18px; height:18px; }
  .meta { font-size:13px; color:var(--muted); }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin:10px 0 6px; }
  .err { color:var(--err); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>Voice Lab</h1>
  <p>One voice throughout (v3, chosen on chapter 0). Play the takes, pull another until one passes, and pick it. The first take stays picked unless you choose another. Nothing reaches the exhibit until the picks are applied.</p>
  <nav id="nav"></nav>
</header>
<main id="main">Loading...</main>
<script>
let S;

async function load() {
  S = await (await fetch("/api/state")).json();
  render();
  await samples();
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : (v !== null && e.setAttribute(k, v));
  for (const k of kids) e.append(k);
  return e;
}

function describe(v) {
  const s = v.voice_settings;
  return `${v.model_id.replace("eleven_", "")} · stab ${s.stability} · sim ${s.similarity_boost} · style ${s.style}` + (s.speed ? ` · speed ${s.speed}` : "");
}

function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

async function samples() {
  const names = await (await fetch("/api/samples")).json();
  if (!names.length) return;
  const box = el("section", {id: "samples"}, el("h2", {}, "Samples to compare", el("small", {}, "build/voice-lab/samples")));
  for (const n of names) box.append(el("div", {class: "take"}, el("span"),
    el("div", {}, el("audio", {controls: "", preload: "none", src: `/sample/${n}`}), el("div", {class: "meta"}, n.replace(".mp3", ""))), el("span")));
  document.getElementById("main").prepend(box);
}

function render() {
  const main = document.getElementById("main"), nav = document.getElementById("nav");
  main.innerHTML = ""; nav.innerHTML = "";
  for (const item of S.items) {
    const takes = S.takes.filter(t => t.item === item.id && same(t.voice, S.voice));
    const picked = S.picks[item.id];
    nav.append(el("a", {href: "#" + item.id, class: takes.some(t => t.id === picked) ? "done" : null}, `${item.chapter}${item.part === "reply" ? "r" : ""}`));
    const text = el("textarea", {}, (takes.filter(t => t.made).pop() || {}).text || item.text);
    const changed = el("span", {class: "changed"});
    const markChanged = () => changed.textContent = text.value === item.text ? "" : "differs from docs/script.md";
    text.addEventListener("input", markChanged); markChanged();
    const err = el("div", {class: "err"});
    const pull = el("button", {class: "primary", onclick: async () => {
      pull.disabled = true; pull.textContent = "Recording..."; err.textContent = "";
      const r = await fetch("/api/generate", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({item: item.id, text: text.value, voice: S.voice})});
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error; pull.disabled = false; pull.textContent = "Try again"; return; }
      await load(); location.hash = item.id;
    }}, "Pull another take");
    const words = el("details", {}, el("summary", {}, "Edit the words"), text, changed,
      el("div", {class: "actions"}, el("button", {onclick: () => { text.value = item.text; markChanged(); }}, "Reset to the script")));
    const list = el("div", {class: "takes"});
    if (!takes.length) list.append(el("div", {class: "meta"}, "Recording the first take..."));
    takes.slice().reverse().forEach((t, i) => {
      const radio = el("input", {type: "radio", name: item.id, onchange: async () => {
        await fetch("/api/pick", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({item: item.id, take: t.id})});
        S.picks[item.id] = t.id; render(); location.hash = item.id;
      }});
      radio.checked = t.id === picked;
      const n = takes.length - i;
      list.append(el("div", {class: "take" + (t.id === picked ? " picked" : "")}, radio,
        el("div", {}, el("audio", {controls: "", preload: "none", src: `/take/${t.id}.mp3`}),
          el("div", {class: "meta"}, `Take ${n}${n === 1 ? " (the default)" : ""} · made ${t.made}` + (t.text !== item.text ? " · edited words" : ""))),
        el("span")));
    });
    main.append(el("section", {id: item.id},
      el("h2", {}, `Chapter ${item.chapter} · ${item.part === "reply" ? "the archaeologists' reply" : "narration"}`, el("small", {}, `${takes.length} takes`)),
      el("p", {class: "meta"}, item.text.slice(0, 160) + (item.text.length > 160 ? "..." : "")),
      el("div", {class: "actions"}, pull), err, words, list));
  }
}
load();
</script>
</body>
</html>
